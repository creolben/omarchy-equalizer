# filter-chain host for the Omarchy Equalizer plugin.
#
# This is a private PipeWire client config (name deliberately not the stock
# filter-chain.conf, which merges every fragment in filter-chain.conf.d/), so the
# equalizer can be started and stopped without restarting pipewire.service --
# a daemon restart drops every PulseAudio client connection.
#
# The filter graph itself is merged from omarchy-equalizer.conf.d/90-eq.conf,
# which bin/omarchy-equalizer regenerates whenever the band configuration
# changes.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-meter
        args = { }
        flags = [ ifexists nofail ]
    }
]
